# Serves the built eventsh SPA. See frontend/Dockerfile.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Hashed static assets can be cached aggressively — index.html itself must
    # NOT be, or a fresh deploy's new hashed JS/CSS refs get masked by a stale
    # cached shell.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # BrowserRouter (client-side routing, see frontend/src/App.tsx) — unmatched
    # paths fall back to index.html instead of a raw Nginx 404 on refresh/deep
    # link into a route like /some-event-id.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
